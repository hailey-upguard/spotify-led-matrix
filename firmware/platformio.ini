; PlatformIO project for the ESP32 HUB75 64x64 album-art panel.
;
; Build/flash:  pio run -t upload    (then `pio device monitor` to see the IP)
;
; This firmware is intentionally dumb: it joins WiFi, advertises itself over
; mDNS as ledmatrix.local, and renders any 64x64 RGB888 frame POSTed to /frame.
; All Spotify logic lives in the host pod.

[env:esp32-matrix]
platform = espressif32
; Adafruit MatrixPortal ESP32-S3 (product 5778): ESP32-S3 with 8MB flash, 2MB
; PSRAM, native USB, and a HUB75 socket on a fixed pinout (see config.h).
; Confirmed on the attached board: esptool reports ESP32-S3 (QFN56) rev v0.2,
; "Embedded PSRAM 2MB", USB mode USB-Serial/JTAG.
board = adafruit_matrixportal_esp32s3
framework = arduino
monitor_speed = 115200
upload_speed = 921600
; The S3's built-in USB-Serial/JTAG port (VID:PID 303A:1001), i.e. the USB-C
; socket. No external adapter and no BOOT-button dance: esptool resets the chip
; into the bootloader itself.
;
; Globbed on purpose. The trailing digits encode the physical USB location and
; change when you move the cable between ports (seen as both usbmodem21101 and
; usbmodem1101), and PlatformIO's own auto-detect doesn't help here: it matches
; the board manifest's Adafruit VID:PID (239A:8125, the TinyUF2 bootloader),
; not the 303A:1001 that the built-in USB-Serial/JTAG presents.
upload_port = /dev/cu.usbmodem*
monitor_port = /dev/cu.usbmodem*
; This board's manifest assumes Adafruit's TinyUF2 CDC bootloader, which is
; entered by opening the port at 1200 baud and then waits for it to re-enumerate
; under Adafruit's own VID:PID. We flash over the raw USB-Serial/JTAG port
; instead, where the touch is a no-op and the wait just hangs. Turn both off.
board_upload.use_1200bps_touch = no
board_upload.wait_for_upload_port = no

; Use a partition table with NO factory partition, so the app actually boots.
;
; The board's stock table (partitions-8MB-tinyuf2.csv) declares Adafruit's
; TinyUF2 bootloader as the *factory* partition at 0x410000, with the app in
; ota_0 at 0x10000. Every esptool upload erases otadata (0xe000-0xffff), and on
; blank otadata the IDF bootloader boots factory, i.e. TinyUF2, which then comes
; up in UF2 mass-storage mode ("MATRXS3BOOT" on the desktop) and leaves our app
; in ota_0 unbooted. Flash writes verify, the panel stays dark, and there is no
; serial port at all because TinyUF2 exposes MSC and no CDC.
;
; default_8MB.csv has no factory partition, so blank otadata falls back to ota_0
; and `pio run -t upload` boots what it just flashed. (The table's second app
; slot is simply unused -- there is no OTA in this firmware.)
;
; Trade-off: this drops TinyUF2 from the partition map, so the UF2 drag-n-drop
; drive is no longer reachable. Recovery is over USB with esptool, which is the
; path this project uses anyway. The TinyUF2 binary is left in flash untouched;
; restoring `partitions-8MB-tinyuf2.csv` brings the drive back.
board_build.partitions = default_8MB.csv
; Stop the platform appending TinyUF2 at 0x410000 on every upload: with the table
; above, that offset is inside app1 (0x340000-0x66ffff).
board_upload.arduino.flash_extra_images =

; Async HTTP server handles binary POST bodies cleanly (chunked, with offsets),
; which the stock WebServer does not. AsyncTCP is its transport dependency.
lib_deps =
    mrfaptastic/ESP32 HUB75 LED MATRIX PANEL DMA Display @ ^3.0.11
    adafruit/Adafruit GFX Library @ ^1.11.9
    adafruit/Adafruit BusIO @ ^1.15.0
    esp32async/ESPAsyncWebServer @ ^3.6.0
    esp32async/AsyncTCP @ ^3.3.2

build_flags =
    -D CORE_DEBUG_LEVEL=2
    ; Route Serial to the S3's *hardware* USB-Serial/JTAG, i.e. the same port we
    ; flash and monitor over. The board manifest sets ARDUINO_USB_CDC_ON_BOOT=1
    ; but leaves ARDUINO_USB_MODE undefined, and the core reads that as 0, which
    ; points Serial at TinyUSB CDC instead: a second USB identity that has to
    ; re-enumerate under Adafruit's own VID:PID. The symptom was a port that
    ; opened fine (303A:1001) and never emitted a byte.
    -D ARDUINO_USB_MODE=1
