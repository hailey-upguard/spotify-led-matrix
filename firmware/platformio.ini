; PlatformIO project for the ESP32 HUB75 64x64 album-art panel.
;
; Build/flash:  pio run -t upload    (then `pio device monitor` to see the IP)
;
; This firmware is intentionally dumb: it joins WiFi, advertises itself over
; mDNS as ledmatrix.local, and renders any 64x64 RGB888 frame POSTed to /frame.
; All Spotify logic lives in the host pod.

[env:esp32-matrix]
platform = espressif32
; This board has a bare ESP32 (no USB-serial chip); the USB-C is power-only.
; Flash via the 4-pin UART header (3V3/RX/TX/GND) using a USB-TTL adapter set to
; 3.3V logic. If the module is actually an ESP32-S3, change board to
; esp32-s3-devkitc-1 (and read the module marking to confirm).
board = esp32dev
framework = arduino
monitor_speed = 115200
; 460800 is reliable over flying-wire UART; raise to 921600 if your wiring is solid.
upload_speed = 460800
; Your FTDI FT232R adapter (set its jumper to 3.3V!). Re-check with: ls /dev/cu.*
upload_port = /dev/cu.usbserial-0001
; No DTR/RTS wired, so esptool can't auto-reset. Enter the bootloader by hand
; before uploading: unplug the panel's USB-C, hold BOOT(IO0) to GND, plug USB-C
; back in (boots into download mode), then run the upload. Power-cycle after to
; run the new firmware.
upload_flags =
    --before=no_reset
    --after=no_reset

; Async HTTP server handles binary POST bodies cleanly (chunked, with offsets),
; which the stock WebServer does not. AsyncTCP is its transport dependency.
lib_deps =
    mrfaptastic/ESP32 HUB75 LED MATRIX PANEL DMA Display @ ^3.0.11
    adafruit/Adafruit GFX Library @ ^1.11.9
    adafruit/Adafruit BusIO @ ^1.15.0
    esp32async/ESPAsyncWebServer @ ^3.6.0
    esp32async/AsyncTCP @ ^3.3.2

build_flags =
    -D CORE_DEBUG_LEVEL=2

; ----------------------------------------------------------------------------
; OTA env: use this for EVERY flash after the first wired one. No wires needed.
;   pio run -e esp32-matrix-ota -t upload
; Targets the panel by mDNS name; if .local doesn't resolve, set the IP instead.
[env:esp32-matrix-ota]
extends = env:esp32-matrix
upload_protocol = espota
upload_port = ledmatrix.local
; Clear the serial bootloader flags inherited from the base env (espota rejects
; them). If you set OTA_PASSWORD in config.h, replace this with the auth flag.
upload_flags =
; upload_flags = --auth=your-ota-password
