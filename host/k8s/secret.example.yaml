# Copy to secret.yaml, fill in, and `kubectl apply -f secret.yaml`.
# DO NOT commit the filled-in version.
apiVersion: v1
kind: Secret
metadata:
  name: spotify-matrix
  namespace: default
type: Opaque
stringData:
  SPOTIFY_CLIENT_ID: "your-client-id"
  SPOTIFY_CLIENT_SECRET: "your-client-secret"
  SPOTIFY_REFRESH_TOKEN: "token-from-auth_bootstrap.py"
